name: Generate Contribution Snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "README.md"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: mahitech580
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2367e8f9&color_dots=%23071121,%23123e56,%230e7490,%2322d3ee,%23a78bfa
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%23071121,%23123e56,%230e7490,%2322d3ee,%23a78bfa

      - name: Publish contribution animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
