name: Generate Contribution Snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "README.md"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: mahitech580
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322c55e&color_dots=%23030b07,%230b2816,%23145432,%2316a34a,%2386efac
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ef4444&color_dots=%23090505,%233f0b0d,%237f1d1d,%23b91c1c,%23fca5a5
            dist/github-contribution-grid-snake-rainbow.svg?color_snake=%23d946ef&color_dots=%23030b12,%23065f46,%230ea5e9,%23a855f7,%23facc15

      - name: Publish contribution animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
