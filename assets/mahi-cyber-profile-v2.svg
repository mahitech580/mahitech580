<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Mahendra Sai Kondaveeti — VISUAL.MAP and SYSTEM.INFO</title>
<desc id="desc">Dark cyberpunk developer profile card inspired by a terminal dashboard. It features Mahendra's real portrait as the only central visual, framed by animated forest-green smoke, crimson-red haze, rainbow neon, and system information.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03070e"/><stop offset=".52" stop-color="#061327"/><stop offset="1" stop-color="#100725"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bfff5"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#4777ff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".54" stop-color="#4777ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#0ea5e9" stop-opacity=".3"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <radialGradient id="greenFog"><stop offset="0" stop-color="#16a34a" stop-opacity=".72"/><stop offset=".42" stop-color="#14532d" stop-opacity=".46"/><stop offset="1" stop-color="#052e16" stop-opacity="0"/></radialGradient>
  <radialGradient id="redFog"><stop offset="0" stop-color="#dc2626" stop-opacity=".68"/><stop offset=".43" stop-color="#7f1d1d" stop-opacity=".43"/><stop offset="1" stop-color="#450a0a" stop-opacity="0"/></radialGradient>
  <linearGradient id="rainbowFog" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset=".2" stop-color="#22d3ee" stop-opacity=".34"/><stop offset=".4" stop-color="#6366f1" stop-opacity=".4"/><stop offset=".6" stop-color="#d946ef" stop-opacity=".36"/><stop offset=".8" stop-color="#ef4444" stop-opacity=".38"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".36"/>
  </linearGradient>
  <linearGradient id="rainbowLine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22c55e"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".36" stop-color="#6366f1"/><stop offset=".54" stop-color="#d946ef"/><stop offset=".72" stop-color="#ef4444"/><stop offset=".88" stop-color="#f59e0b"/><stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
  <filter id="smokeBlur" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .035" numOctaves="2" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#22d3ee" stroke-opacity=".075"/><circle cx="0" cy="0" r="1" fill="#67e8f9" fill-opacity=".18"/></pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#e0f2fe" fill-opacity=".12"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="speckle" x="-18%" y="-18%" width="136%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="1" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <clipPath id="visualClip"><rect x="54" y="144" width="418" height="330" rx="8"/></clipPath>
</defs>
<style>
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
  .muted{fill:#7892b6}
  .white{fill:#eaf7ff}
  .cyan{fill:#67e8f9}
  .violet{fill:#c4b5fd}
  .tiny{font-size:11px;letter-spacing:1.55px}
  .label{font-size:10px;letter-spacing:1.2px;fill:#7892b6}
  .value{font-size:12.5px;fill:#e5f7ff}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .scan{animation:scan 5.6s linear infinite}
  .float{animation:float 4.2s ease-in-out infinite}
  .headline{font-size:22px;font-weight:650;fill:#eaf7ff;letter-spacing:.6px;opacity:0}
  .headline-a{animation:headline-a 16s linear infinite}
  .headline-b{animation:headline-b 16s linear infinite}
  .headline-c{animation:headline-c 16s linear infinite}
  .visual-face{opacity:1}
  .smoke{mix-blend-mode:screen;transform-box:fill-box;transform-origin:center;opacity:.22}
  .smoke-green{animation:green-smoke 13s ease-in-out infinite}
  .smoke-red{animation:red-smoke 15s ease-in-out infinite}
  .smoke-rainbow{animation:rainbow-smoke 18s ease-in-out infinite}
  .rainbow-frame{stroke-dasharray:190 1120;animation:rainbow-flow 11s linear infinite}
  .smoke-hover-zone:hover .smoke-green{opacity:.52}
  .smoke-hover-zone:hover .smoke-red{opacity:.55}
  .smoke-hover-zone:hover .smoke-rainbow{opacity:.5}
  @keyframes green-smoke{0%,100%{transform:translate(-8px,12px) scale(.92);opacity:.12}50%{transform:translate(36px,-16px) scale(1.18);opacity:.32}}
  @keyframes red-smoke{0%,100%{transform:translate(12px,-8px) scale(1);opacity:.12}50%{transform:translate(-32px,20px) scale(1.22);opacity:.3}}
  @keyframes rainbow-smoke{0%,100%{transform:translateX(-30px) scaleX(.9);opacity:.12}50%{transform:translateX(30px) scaleX(1.12);opacity:.3}}
  @keyframes rainbow-flow{to{stroke-dashoffset:-1310;filter:hue-rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.pulse,.scan,.float,.headline-a,.headline-b,.headline-c,.smoke-green,.smoke-red,.smoke-rainbow,.rainbow-frame{animation:none}}
</style>

<rect width="1200" height="710" rx="22" fill="url(#bg)"/>
<rect width="1200" height="710" rx="22" fill="url(#grid)"/>
