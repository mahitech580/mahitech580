  <ellipse class="smoke smoke-red" cx="1170" cy="350" rx="178" ry="285" fill="url(#redFog)"/>
  <ellipse class="smoke smoke-rainbow" cx="620" cy="4" rx="520" ry="115" fill="url(#rainbowFog)"/>
  <ellipse class="smoke smoke-green" cx="575" cy="711" rx="460" ry="90" fill="url(#greenFog)"/>
</g>
<rect x="12" y="12" width="1176" height="686" rx="18" fill="none" stroke="#164e63" stroke-width="1.2"/>
<rect x="16" y="16" width="1168" height="678" rx="16" fill="none" stroke="url(#cyan)" stroke-opacity=".82" filter="url(#glow)"/>
<rect x="17" y="17" width="1166" height="676" rx="15" fill="none" stroke="url(#rainbowLine)" stroke-width="1.8" opacity=".72" class="rainbow-frame" filter="url(#glow)"/>

