  <text x="68" y="164" class="mono" font-size="12" fill="#dbeafe">$ focus --current   <tspan fill="#86efac">Python</tspan><tspan fill="#7892b6"> / </tspan><tspan fill="#fca5a5">SQL</tspan><tspan fill="#7892b6"> / </tspan><tspan fill="#67e8f9">Backend</tspan><tspan fill="#7892b6"> / </tspan><tspan fill="#c4b5fd">Applied AI/ML</tspan></text>
  <rect x="871" y="76" width="275" height="81" rx="11" fill="#062218" stroke="#22c55e" stroke-opacity=".8"/>
