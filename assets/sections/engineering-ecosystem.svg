<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc">
<title id="title">04 Engineering Ecosystem</title><desc id="desc">Animated 3D heading panel for the engineering ecosystem with green, crimson, and rainbow glow.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03090b"/><stop offset=".52" stop-color="#081522"/><stop offset="1" stop-color="#15070e"/></linearGradient>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".38" stop-color="#6366f1"/><stop offset=".56" stop-color="#d946ef"/><stop offset=".76" stop-color="#ef4444"/><stop offset=".9" stop-color="#f59e0b"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#14532d"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f87171"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
  <radialGradient id="greenFog"><stop stop-color="#22c55e" stop-opacity=".68"/><stop offset=".42" stop-color="#14532d" stop-opacity=".45"/><stop offset="1" stop-color="#052e16" stop-opacity="0"/></radialGradient>
  <radialGradient id="redFog"><stop stop-color="#ef4444" stop-opacity=".62"/><stop offset=".43" stop-color="#7f1d1d" stop-opacity=".42"/><stop offset="1" stop-color="#450a0a" stop-opacity="0"/></radialGradient>
  <radialGradient id="rainbowFog"><stop stop-color="#d946ef" stop-opacity=".38"/><stop offset=".35" stop-color="#22d3ee" stop-opacity=".28"/><stop offset=".68" stop-color="#22c55e" stop-opacity=".24"/><stop offset="1" stop-color="#03090b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#67e8f9" stroke-opacity=".07" fill="none"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="21"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:Consolas,'Liberation Mono',monospace}
  .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
  .float3d{transform-box:fill-box;transform-origin:center;animation:float3d 7s ease-in-out infinite}
  .floatAlt{transform-box:fill-box;transform-origin:center;animation:floatAlt 9s ease-in-out infinite}
  .greenSmoke{transform-box:fill-box;transform-origin:center;opacity:.23;animation:greenSmoke 12s ease-in-out infinite}
  .redSmoke{transform-box:fill-box;transform-origin:center;opacity:.2;animation:redSmoke 14s ease-in-out infinite}
  .rainbowSmoke{transform-box:fill-box;transform-origin:center;opacity:.16;animation:rainbowSmoke 16s ease-in-out infinite}
  .rainbowBorder{stroke-dasharray:120 950;animation:borderFlow 12s linear infinite}
  .glow{filter:url(#glow)}
  .smoke-hover-zone:hover .greenSmoke{opacity:.52}
  .smoke-hover-zone:hover .redSmoke{opacity:.56}
  .smoke-hover-zone:hover .rainbowSmoke{opacity:.5}
  @keyframes float3d{0%,100%{transform:perspective(1000px) rotateX(0deg) rotateY(-.65deg) translateY(0)}50%{transform:perspective(1000px) rotateX(1deg) rotateY(.65deg) translateY(-4px)}}
  @keyframes floatAlt{0%,100%{transform:perspective(1000px) rotateX(.5deg) rotateY(.7deg) translateY(0)}50%{transform:perspective(1000px) rotateX(-1deg) rotateY(-.7deg) translateY(3px)}}
  @keyframes greenSmoke{0%,100%{transform:translate(-9px,8px) scale(.94);opacity:.12}50%{transform:translate(28px,-10px) scale(1.18);opacity:.34}}
  @keyframes redSmoke{0%,100%{transform:translate(12px,-6px) scale(1);opacity:.12}50%{transform:translate(-27px,16px) scale(1.2);opacity:.34}}
  @keyframes rainbowSmoke{0%,100%{transform:translateX(-24px) scaleX(.9);opacity:.1}50%{transform:translateX(25px) scaleX(1.12);opacity:.28}}
  @keyframes borderFlow{to{stroke-dashoffset:-1070;filter:hue-rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.float3d,.floatAlt,.greenSmoke,.redSmoke,.rainbowSmoke,.rainbowBorder{animation:none}}
</style><rect width="1200" height="132" rx="20" fill="url(#base)"/><rect width="1200" height="132" rx="20" fill="url(#grid)"/><g class="smoke-hover-zone" filter="url(#blur)"><ellipse class="greenSmoke" cx="65" cy="81.84" rx="160" ry="92.39999999999999" fill="url(#greenFog)"/><ellipse class="redSmoke" cx="1130" cy="63.36" rx="160" ry="100.32000000000001" fill="url(#redFog)"/><ellipse class="rainbowSmoke" cx="600" cy="0" rx="576" ry="97.67999999999999" fill="url(#rainbowFog)"/></g><rect x="1" y="1" width="1198" height="130" rx="19" fill="none" stroke="#174b51"/><rect x="4" y="4" width="1192" height="124" rx="17" fill="none" stroke="url(#rainbow)" stroke-width="1.5" class="rainbowBorder" opacity=".9"/><g class="float3d">
  <rect x="18" y="17" width="1164" height="98" rx="16" fill="#071321" fill-opacity=".93" stroke="#36515b"/>
  <path d="M40 91H1159" stroke="#164e63"/>
  <text x="44" y="43" class="mono" font-size="10" letter-spacing="2.1" fill="#86efac">04 // STACK.MAP <tspan fill="#7892b6">/</tspan> ECOSYSTEM</text>
  <text x="42" y="75" class="ui" font-size="29" font-weight="800" fill="#f0fdf4">ENGINEERING ECOSYSTEM</text>
  <text x="45" y="101" class="mono" font-size="10" letter-spacing="1.4" fill="#9cc8b2">SOFTWARE · AUTOMATION · DATA · APPLIED INTELLIGENCE</text>
  <g class="mono" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="814" y="34" width="112" height="29" rx="8" fill="#123c25" stroke="#4ade80"/><text x="870" y="52" fill="#bbf7d0">ENGINEERING</text>
    <rect x="937" y="34" width="79" height="29" rx="8" fill="#123044" stroke="#38bdf8"/><text x="976" y="52" fill="#bae6fd">DATA</text>
    <rect x="1027" y="34" width="125" height="29" rx="8" fill="#3b1018" stroke="#f87171"/><text x="1089" y="52" fill="#fecaca">AI / ML</text>
  </g>
  <circle cx="1153" cy="85" r="4" fill="#f87171"/><circle cx="1138" cy="85" r="4" fill="#4ade80"/><circle cx="1123" cy="85" r="4" fill="#67e8f9"/>
</g></svg>