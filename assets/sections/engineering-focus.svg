<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="335" viewBox="0 0 1200 335" role="img" aria-labelledby="title desc">
<title id="title">03 Engineering Focus — Software Engineering and Data &amp; Applied AI</title><desc id="desc">Two animated 3D glass panels listing software engineering fundamentals and data and applied AI focus areas.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03090b"/><stop offset=".52" stop-color="#081522"/><stop offset="1" stop-color="#15070e"/></linearGradient>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".38" stop-color="#6366f1"/><stop offset=".56" stop-color="#d946ef"/><stop offset=".76" stop-color="#ef4444"/><stop offset=".9" stop-color="#f59e0b"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#14532d"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f87171"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
  <radialGradient id="greenFog"><stop stop-color="#22c55e" stop-opacity=".68"/><stop offset=".42" stop-color="#14532d" stop-opacity=".45"/><stop offset="1" stop-color="#052e16" stop-opacity="0"/></radialGradient>
  <radialGradient id="redFog"><stop stop-color="#ef4444" stop-opacity=".62"/><stop offset=".43" stop-color="#7f1d1d" stop-opacity=".42"/><stop offset="1" stop-color="#450a0a" stop-opacity="0"/></radialGradient>
  <radialGradient id="rainbowFog"><stop stop-color="#d946ef" stop-opacity=".38"/><stop offset=".35" stop-color="#22d3ee" stop-opacity=".28"/><stop offset=".68" stop-color="#22c55e" stop-opacity=".24"/><stop offset="1" stop-color="#03090b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#67e8f9" stroke-opacity=".07" fill="none"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="21"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:Consolas,'Liberation Mono',monospace}
  .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
  .float3d{transform-box:fill-box;transform-origin:center;animation:float3d 7s ease-in-out infinite}
  .floatAlt{transform-box:fill-box;transform-origin:center;animation:floatAlt 9s ease-in-out infinite}
  .greenSmoke{transform-box:fill-box;transform-origin:center;opacity:.23;animation:greenSmoke 12s ease-in-out infinite}
  .redSmoke{transform-box:fill-box;transform-origin:center;opacity:.2;animation:redSmoke 14s ease-in-out infinite}
  .rainbowSmoke{transform-box:fill-box;transform-origin:center;opacity:.16;animation:rainbowSmoke 16s ease-in-out infinite}
  .rainbowBorder{stroke-dasharray:120 950;animation:borderFlow 12s linear infinite}
  .glow{filter:url(#glow)}
  @keyframes float3d{0%,100%{transform:perspective(1000px) rotateX(0deg) rotateY(-.65deg) translateY(0)}50%{transform:perspective(1000px) rotateX(1deg) rotateY(.65deg) translateY(-4px)}}
  @keyframes floatAlt{0%,100%{transform:perspective(1000px) rotateX(.5deg) rotateY(.7deg) translateY(0)}50%{transform:perspective(1000px) rotateX(-1deg) rotateY(-.7deg) translateY(3px)}}
  @keyframes greenSmoke{0%,100%{transform:translate(-9px,8px) scale(.94);opacity:.12}50%{transform:translate(28px,-10px) scale(1.18);opacity:.34}}
  @keyframes redSmoke{0%,100%{transform:translate(12px,-6px) scale(1);opacity:.12}50%{transform:translate(-27px,16px) scale(1.2);opacity:.34}}
  @keyframes rainbowSmoke{0%,100%{transform:translateX(-24px) scaleX(.9);opacity:.1}50%{transform:translateX(25px) scaleX(1.12);opacity:.28}}
  @keyframes borderFlow{to{stroke-dashoffset:-1070;filter:hue-rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.float3d,.floatAlt,.greenSmoke,.redSmoke,.rainbowSmoke,.rainbowBorder{animation:none}}
</style><rect width="1200" height="335" rx="20" fill="url(#base)"/><rect width="1200" height="335" rx="20" fill="url(#grid)"/><g filter="url(#blur)"><ellipse class="greenSmoke" cx="65" cy="207.7" rx="160" ry="234.49999999999997" fill="url(#greenFog)"/><ellipse class="redSmoke" cx="1130" cy="160.79999999999998" rx="160" ry="254.6" fill="url(#redFog)"/><ellipse class="rainbowSmoke" cx="600" cy="0" rx="576" ry="247.9" fill="url(#rainbowFog)"/></g><rect x="1" y="1" width="1198" height="333" rx="19" fill="none" stroke="#174b51"/><rect x="4" y="4" width="1192" height="327" rx="17" fill="none" stroke="url(#rainbow)" stroke-width="1.5" class="rainbowBorder" opacity=".9"/><g class="float3d">
  <rect x="22" y="19" width="568" height="296" rx="18" fill="#071b13" fill-opacity=".93" stroke="#22c55e" stroke-opacity=".85" stroke-width="1.5"/>
  <rect x="29" y="26" width="554" height="282" rx="14" fill="none" stroke="#86efac" stroke-opacity=".2"/>
  <path d="M42 78H570" stroke="#166534"/>
  <rect x="42" y="37" width="6" height="27" rx="3" fill="#4ade80"/>
  <text x="62" y="48" class="mono" font-size="10" letter-spacing="1.7" fill="#86efac">03 // ENGINEERING FOCUS</text>
  <text x="62" y="69" class="ui" font-size="22" font-weight="750" fill="#f0fdf4">Software Engineering</text>
  <g class="ui" font-size="15" fill="#dcfce7">
    <circle cx="53" cy="106" r="3" fill="#4ade80"/><text x="68" y="111">Python fundamentals &amp; problem solving</text>
    <circle cx="53" cy="144" r="3" fill="#4ade80"/><text x="68" y="149">Data structures, algorithms &amp; SQL</text>
    <circle cx="53" cy="182" r="3" fill="#4ade80"/><text x="68" y="187">Relational database design</text>
    <circle cx="53" cy="220" r="3" fill="#4ade80"/><text x="68" y="225">Backend services &amp; REST API workflows</text>
    <circle cx="53" cy="258" r="3" fill="#4ade80"/><text x="68" y="263">Maintainable code &amp; practical testing</text>
  </g>
  <rect x="42" y="282" width="505" height="19" rx="5" fill="#0b3825"/><text x="53" y="295" class="mono" font-size="9" letter-spacing="1.3" fill="#86efac">BUILD / TEST / ITERATE</text>
</g>
<g class="floatAlt">
  <rect x="610" y="19" width="568" height="296" rx="18" fill="#1b0b10" fill-opacity=".93" stroke="#ef4444" stroke-opacity=".83" stroke-width="1.5"/>
  <rect x="617" y="26" width="554" height="282" rx="14" fill="none" stroke="#fca5a5" stroke-opacity=".2"/>
  <path d="M630 78H1158" stroke="#7f1d1d"/>
  <rect x="630" y="37" width="6" height="27" rx="3" fill="#f87171"/>
  <text x="650" y="48" class="mono" font-size="10" letter-spacing="1.7" fill="#fca5a5">TRACK 02 <tspan fill="#82434a">/</tspan> DATA + AI</text>
  <text x="650" y="69" class="ui" font-size="22" font-weight="750" fill="#fff1f2">Data &amp; Applied AI</text>
  <g class="ui" font-size="15" fill="#ffe4e6">
    <circle cx="641" cy="106" r="3" fill="#f87171"/><text x="656" y="111">Data analysis &amp; quality checks</text>
    <circle cx="641" cy="144" r="3" fill="#f87171"/><text x="656" y="149">ML workflows &amp; model evaluation</text>
    <circle cx="641" cy="182" r="3" fill="#f87171"/><text x="656" y="187">Computer vision &amp; video processing</text>
    <circle cx="641" cy="220" r="3" fill="#f87171"/><text x="656" y="225">Local LLM &amp; voice-assistant experiments</text>
    <circle cx="641" cy="258" r="3" fill="#f87171"/><text x="656" y="263">Explainable, responsible app design</text>
  </g>
  <rect x="630" y="282" width="505" height="19" rx="5" fill="#401015"/><text x="641" y="295" class="mono" font-size="9" letter-spacing="1.3" fill="#fca5a5">ANALYZE / EVALUATE / EXPLAIN</text>
</g>
<path d="M590 48V286" stroke="url(#rainbow)" stroke-opacity=".65" stroke-dasharray="3 8"/></svg>